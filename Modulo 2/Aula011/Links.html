<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*  
            SELETORES PERSONALIZADOS
            # = id
            . = classes
            : = pseudo - class
            :: = pseudo - element
            > = clildren
        */
            
        body {
            font-family: Arial, Helvetica, sans-serif
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;

        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color:black;
            text-decoration: underline;
        }

        a:active {
            color: rgb(100, 243, 100);
        }

        a::after {
            content: '[link]';
            content: '←';

        }

        a::before {
            content: '→';
        }

        .especial {
            background-color: rgb(255, 148, 140);
        }

        .especial::before {
            content: '←';
        }

        .especial::after {
            content: '→';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://www.instagram.com/apenas_correia/" target="_blank">Instagram pessoal</a></li>        
        <li><a href="https://www.youtube.com/@Forterrs" class="especial" target="_blank">Canal do Youtube</a></li>
        <li><a href="https://github.com/Forterrs0" target="_blank">Repositório do Github</a></li>
    </ul>
</body>
</html>
